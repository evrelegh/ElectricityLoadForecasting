[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electricity-load-forecasting"
version = "0.2.0"
description = "Probabilistic day-ahead electricity load forecasting on Belgian grid data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Erik Van Releghem" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
